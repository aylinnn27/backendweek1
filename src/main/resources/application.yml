server:
  port: 8080

spring:
  application:
    name: library-management

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ---- MYSQL (uncomment and comment out H2 block above to use MySQL) ----
  # datasource:
  #   url: jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true
  #   username: root
  #   password: your_password
  #   driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- POSTGRESQL (alternative) ----
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/librarydb
  #   username: postgres
  #   password: your_password
  #   driver-class-name: org.postgresql.Driver

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000

app:
  file:
    upload-dir: uploads/books
    max-size: 5242880
    allowed-types: application/pdf,image/jpeg,image/png
  cleanup:
    retention-days: 7

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
