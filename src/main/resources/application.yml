server:
  port: 8080

spring:
  application:
    name: library-management

  # ---- DEFAULT: H2 in-memory DB so the project runs instantly with zero setup ----
  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ---- MYSQL (uncomment and comment out the H2 block above to use MySQL) ----
  # datasource:
  #   url: jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true
  #   username: root
  #   password: your_password
  #   driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- POSTGRESQL (alternative) ----
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/librarydb
  #   username: postgres
  #   password: your_password
  #   driver-class-name: org.postgresql.Driver

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
